name: Publish npm

on:
  push:
    branches:
      - release

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: npm publish (@b4moss/hyogen-md)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      # Node 24 ships npm ≥ 11.5.1 (Trusted Publishing). Avoid `npm install -g`
      # so Scorecard Pinned-Dependencies stays hash-pinned via package-lock only.

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish if version is new
        run: |
          set -euo pipefail
          NPMRC_PATH="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$NPMRC_PATH" ]; then
            sed -i '/_authToken/d' "$NPMRC_PATH"
          fi
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "Skip publish: ${NAME}@${VERSION} already on npm"
            exit 0
          fi
          npm publish --access public --provenance
