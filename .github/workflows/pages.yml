# Docs site on GitHub Pages — production branch: doc-site
# Spec: #7 / #69 / docs/specs/repository.md
# Playground aliases ../app/src — install app deps first
# Custom domain: hyogenmd.oss.b4m.jp (docs-site/public/CNAME)

name: Deploy docs site

on:
  push:
    branches:
      - doc-site
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build docs-site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            docs-site/package-lock.json

      - name: Install app dependencies
        run: npm ci
        working-directory: app

      - name: Install docs-site dependencies
        run: npm install --no-audit --no-fund
        working-directory: docs-site

      - name: Generate static site
        run: make build-docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs-site/.output/public

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
