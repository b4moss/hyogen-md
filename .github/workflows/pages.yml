# Docs site on GitHub Pages — production branch: main
# Spec: #7 / dev-docs/repository.md
# Playground aliases ../app/src — install app deps first
# Custom domain: hyogenmd.oss.b4m.jp (docs-site/public/CNAME)

name: Deploy docs site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build docs-site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            docs-site/package-lock.json

      - name: Install app dependencies
        run: npm ci
        working-directory: app

      - name: Install docs-site dependencies
        run: npm ci
        working-directory: docs-site

      - name: Generate static site
        run: make build-docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/.output/public

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
