# App CI — gate on feat/* → dev-v* and hotfix/* → main only.
# Spec: #69 / docs/specs/repository.md
#
# Promotion PRs (develop→main, etc.) still match `branches: main` when they touch
# app/**; the job `if` skips them so required-check noise stays minimal.

name: CI

on:
  pull_request:
    branches:
      - "dev-v*"
      - main
    paths:
      - "app/**"
      - "Makefile"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: app
    # Skip develop→main and other non-hotfix PRs into main.
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.base_ref, 'dev-v') ||
      (github.base_ref == 'main' && startsWith(github.head_ref, 'hotfix/'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        run: npm ci
        working-directory: app

      - name: make check
        run: make check
