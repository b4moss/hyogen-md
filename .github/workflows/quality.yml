# Quality signals on main only (Codecov).
# Spec: #69 / docs/specs/repository.md

name: Quality

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codecov:
    name: Codecov
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        run: npm ci
        working-directory: app

      # client.bundle tests import dist/client.js — build before coverage
      - name: Build app
        run: npm run build
        working-directory: app

      - name: app coverage
        run: npm run test:coverage
        working-directory: app

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@1f60566a86da84c4b4b64c17662a90de97fbb8d7 # v5.4.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: app/coverage/lcov.info
          fail_ci_if_error: false
          verbose: true
